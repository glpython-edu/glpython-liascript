name: Check macro

# The macro goes live in every course when main changes, so every pull
# request checks it first, and main again after the merge. (A pull request's
# branch runs once, as pull_request.)
on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-macro.mjs
      - run: npm ci
      # Chrome is installed on GitHub's runners; playwright-core drives it.
      - run: npm run check:ready
